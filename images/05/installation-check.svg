<svg xmlns="http://www.w3.org/2000/svg" width="960" height="500" viewBox="0 0 960 500" role="img" aria-labelledby="title desc">
<title id="title">냉장고 설치 환경 확인</title>
<desc id="desc">주변 공간, 문 개폐 공간, 열원과 주변 온도, 단단하고 고른 바닥을 확인하는 냉장고 설치 개념도입니다. 실제 치수와 온도 범위는 제품 설명서를 따릅니다.</desc>
<rect width="960" height="500" rx="20" fill="#f1f5f9"/>
<g font-family="Apple SD Gothic Neo, Malgun Gothic, sans-serif" fill="#0f172a">
<text x="480" y="44" text-anchor="middle" font-size="26" font-weight="bold">냉장고 설치 환경, 네 가지 확인</text>
<rect x="370" y="95" width="205" height="310" rx="16" fill="#dbeafe" stroke="#2563eb" stroke-width="3"/>
<path d="M370 200 H575" stroke="#2563eb" stroke-width="3"/>
<path d="M550 125 V172 M550 230 V290" stroke="#2563eb" stroke-width="6" stroke-linecap="round"/>
<path d="M345 85 V420 H605 V85" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="7 5"/>
<path d="M320 425 H640" stroke="#334155" stroke-width="5"/>
<rect x="30" y="100" width="280" height="100" rx="12" fill="white"/>
<text x="50" y="133" font-size="20" font-weight="bold">① 주변 공간</text>
<text x="50" y="164" font-size="16">벽·가구와의 간격은 모델 기준 확인</text>
<path d="M310 150 H365" stroke="#64748b" stroke-width="2"/>
<rect x="650" y="100" width="280" height="100" rx="12" fill="white"/>
<text x="670" y="133" font-size="20" font-weight="bold">② 문 개폐 공간</text>
<text x="670" y="164" font-size="16">문과 서랍을 열 공간 확보</text>
<path d="M580 150 H650" stroke="#64748b" stroke-width="2"/>
<rect x="30" y="290" width="280" height="100" rx="12" fill="white"/>
<text x="50" y="323" font-size="20" font-weight="bold">③ 열원과 주변 온도</text>
<text x="50" y="354" font-size="16">직사광선·조리기구의 열 피하기</text>
<path d="M310 340 H365" stroke="#64748b" stroke-width="2"/>
<rect x="650" y="290" width="280" height="100" rx="12" fill="white"/>
<text x="670" y="323" font-size="20" font-weight="bold">④ 바닥과 수평</text>
<text x="670" y="354" font-size="16">단단하고 고른 바닥·흔들림 확인</text>
<path d="M605 425 H630 V340 H650" fill="none" stroke="#64748b" stroke-width="2"/>
<text x="480" y="471" text-anchor="middle" font-size="17" fill="#475569">실제 설치 치수·온도 범위는 모델별 사용설명서를 따르세요. (축척 없는 개념도)</text>
</g></svg>
